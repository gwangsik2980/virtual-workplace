<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Workplace</title>
    <meta name="theme-color" content="#ffffff" />
    <script>
      (function () {
        try {
          var p = localStorage.getItem('virtual-workplace/theme');
          var d = p === 'dark' || (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = d ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <meta name="description" content="가상의 식품 제조기업에서 구매 담당자의 업무를 관찰하고, 비효율을 찾아 도구로 개선하고, 효과를 검증하는 시뮬레이션" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%230a0a0a'/><rect x='8' y='8' width='7' height='7' rx='2' fill='%23cf8047'/><rect x='17' y='8' width='7' height='7' rx='3.5' fill='white'/><rect x='8' y='17' width='7' height='7' rx='3.5' fill='white'/><rect x='17' y='17' width='7' height='7' rx='2' fill='white'/></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
